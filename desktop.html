<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>HTML 5 Boilerplate</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "animejs": "./node_modules/animejs/dist/modules/index.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="large row centered">
      <canvas id="bgCanvas"></canvas>
      <div class="square draggable">
        <div class="window-titlebar">
          <span class="window-title">Jakub Adamczyk Resume</span>
          <div class="window-controls">
            <span title="Minimize">&#8212;</span>
            <span title="Maximize">&#9723;</span>
            <span title="Close">&#10005;</span>
          </div>
        </div>
        <div class="address-bar">
          <div class="address-input" >
            <span class="lock-icon">🔒</span>
            <span class="url">https://Jakub.Adamczyk.Awsome</span>
          </div>
        </div>
        <div class="window-content">
          <h1>Welcome to My Website</h1>
          <p>This is a draggable browser window simulation.</p>
          <button class="cta-button">Get Started</button>
          <div class="feature-grid">
            <div class="feature-card">
              <h3>Feature 1</h3>
              <p>Amazing functionality here</p>
            </div>
            <div class="feature-card">
              <h3>Feature 2</h3>
              <p>More great features</p>
            </div>
          </div>
        </div>
        <div class="resize-handle resize-top"></div>
        <div class="resize-handle resize-right"></div>
        <div class="resize-handle resize-bottom"></div>
        <div class="resize-handle resize-left"></div>
        <div class="resize-handle resize-corner-tl"></div>
        <div class="resize-handle resize-corner-tr"></div>
        <div class="resize-handle resize-corner-bl"></div>
        <div class="resize-handle resize-corner-br"></div>
      </div>
    </div>
    <script type="module" src="js/index.js"></script>

    <!-- Windows-style Taskbar -->
    <div class="taskbar">
      <div class="taskbar-left">
        <button class="start-button" data-tooltip="Start">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <rect x="1" y="1" width="8" height="8" fill="currentColor"/>
            <rect x="11" y="1" width="8" height="8" fill="currentColor"/>
            <rect x="1" y="11" width="8" height="8" fill="currentColor"/>
            <rect x="11" y="11" width="8" height="8" fill="currentColor"/>
          </svg>
        </button>
<!--         <div class="search-box">
          <span class="search-icon">🔍</span>
          <span class="search-text">Type here to search</span>
        </div> -->
      </div>
      
      <div class="taskbar-center">
        <button class="taskbar-app active" data-tooltip="Browser">
          <span>🌐</span>
        </button>
        <button class="taskbar-app" data-tooltip="File Explorer">
          <span>📁</span>
        </button>
        <button class="taskbar-app" data-tooltip="Mail">
          <span>✉️</span>
        </button>
      </div>
      
      <div class="taskbar-right">
        <div class="system-tray">
          <a href="mobile.html" class="tray-icon" data-tooltip="Mobile View" style="text-decoration: none; cursor: pointer;" title="Switch to Mobile View">📱</a>
          <span class="tray-icon">🔊</span>
          <span class="tray-icon">📶</span>
          <span class="tray-icon">🔋</span>
          <div class="datetime">
            <div class="time">12:00 PM</div>
            <div class="date">2/18/2026</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Save preference when switching to mobile view
      document.querySelectorAll('a[href="mobile.html"]').forEach(link => {
        link.addEventListener('click', () => {
          localStorage.setItem('viewPreference', 'mobile');
        });
      });
    </script>
  </body>
</html>
