<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Jakub Adamczyk — Interactive Desktop</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "animejs": "./js/vendor/anime.esm.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="large row centered">
      <canvas id="bgCanvas"></canvas>
      <div class="desktop-icons" id="desktopIcons">
        <!-- Desktop icons will be added here dynamically -->
      </div>
      <div class="windows-container" id="windowsContainer">
        <!-- Windows will be added here dynamically -->
      </div>
    </div>

    <!-- Start Menu -->
    <div class="start-menu" id="startMenu">
      <div class="start-menu-header">
        <div class="user-profile">
          <div class="user-avatar">👤</div>
          <span class="user-name">Jakub Adamczyk</span>
        </div>
      </div>
      <div class="start-menu-content">
        <div class="pinned-apps">
          <div class="section-title">Pinned</div>
          <div class="app-grid" id="pinnedApps">
            <!-- Apps will be added dynamically -->
          </div>
        </div>
      </div>
      <div class="start-menu-footer">
        <button class="power-button" data-tooltip="Power">⏻</button>
      </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
      <!-- Context menu items will be added dynamically -->
    </div>

    <!-- Windows-style Taskbar -->
    <div class="taskbar">
      <div class="taskbar-left">
        <button class="start-button" data-tooltip="Start">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <rect x="1" y="1" width="8" height="8" fill="currentColor"/>
            <rect x="11" y="1" width="8" height="8" fill="currentColor"/>
            <rect x="1" y="11" width="8" height="8" fill="currentColor"/>
            <rect x="11" y="11" width="8" height="8" fill="currentColor"/>
          </svg>
        </button>
      </div>
      
      <div class="taskbar-center" id="taskbarCenter">
        <!-- Taskbar apps will be added here dynamically -->
      </div>
      
      <div class="taskbar-right">
        <div class="system-tray">
          <a href="../../index.html" class="tray-icon" data-tooltip="Portfolio Home" style="text-decoration: none; cursor: pointer;" title="Back to Portfolio"><svg viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M12 3 L3 11 h2 v9 h5 v-6 h4 v6 h5 v-9 h2 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/></svg></a>
          <span class="tray-icon" data-tooltip="Volume"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:white;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
          <span class="tray-icon" data-tooltip="Network"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:white;"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg></span>
          <span class="tray-icon" data-tooltip="Battery"><svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:white;"><rect x="2" y="4" width="18" height="12" rx="2" fill="none" stroke="white" stroke-width="1.5"/><rect x="3" y="5" width="14" height="10" fill="white" opacity="0.7"/><rect x="20" y="7" width="2" height="6" fill="white"/></svg></span>
          <div class="datetime">
            <div class="time">12:00 PM</div>
            <div class="date">2/18/2026</div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
